<script>
  const MAG_FILTERS = [
    { key: "all", label: "All Mags" },
    { key: "range rover", label: "Range Rover" },
    { key: "mercedes", label: "Mercedes" },
    { key: "g-class", label: "G-Class" },
    { key: "audi", label: "Audi" },
    { key: "porsche", label: "Porsche" },
    { key: "nissan", label: "Nissan GT-R" },
    { key: "bakkie", label: "Bakkie" },
  ];

  let activeFilter = "all";

  function magsMatch(product, key) {
    if (key === "all") return true;
    return product.brandFit.toLowerCase().includes(key);
  }

  function renderMagFilters() {
    const bar = document.getElementById("filterBar");
    bar.innerHTML = MAG_FILTERS.map(
      (f) => `<button class="filter-chip ${f.key === activeFilter ? "active" : ""}" data-key="${f.key}">${f.label}</button>`
    ).join("");
    bar.querySelectorAll(".filter-chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeFilter = btn.dataset.key;
        renderMagFilters();
        applyMagFilter();
      });
    });
  }

  function applyMagFilter() {
    const mags = getProductsByCategory("mags").filter((p) => magsMatch(p, activeFilter));
    renderProductGrid("magsGrid", mags);
  }

  document.addEventListener("DOMContentLoaded", () => {
    renderMagFilters();
    applyMagFilter();
    const ctaWa = document.getElementById("ctaWhatsapp");
    if (ctaWa) ctaWa.href = waLink("Hi RIM STUDIO, I'd like to check wheel fitment for my car.");
  });
</script>
