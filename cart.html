<body data-page="">

<div id="site-header"></div>

<main>
  <section class="page-header" style="padding-bottom:50px;">
    <div class="wrap">
      <span class="section-label">Cart</span>
      <h1 class="h1" style="font-size:clamp(2.2rem,5vw,3.4rem);">Your cart</h1>
    </div>
  </section>

  <section class="section-tight">
    <div class="wrap two-col" style="align-items:flex-start;" id="cartLayout">
      <div id="cartItems"></div>

      <div class="card" id="cartSummary">
        <h3 class="h3" style="margin-bottom:18px;">Order summary</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">R 0</span></div>
        <div class="summary-row"><span>Fitment &amp; balancing</span><span>Confirmed at showroom</span></div>
        <div class="summary-row total"><span>Estimated Total</span><span id="sumTotal">R 0</span></div>
        <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:22px;">Proceed to Checkout</a>
        <a href="mags.html" class="btn btn-ghost btn-block" style="margin-top:12px;">Continue Shopping</a>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>
<div id="site-whatsapp"></div>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/render.js"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script>
  function cartLineHTML(line) {
    const p = line.product;
    return `
    <div class="card" style="display:flex; gap:18px; align-items:center; margin-bottom:16px;">
      <a href="product.html?id=${p.id}" style="width:110px; flex-shrink:0;">
        ${productImageMarkup(p)}
      </a>
      <div style="flex:1; min-width:0;">
        <a href="product.html?id=${p.id}"><h4 style="font-family:var(--font-display); font-size:1.05rem; margin-bottom:4px;">${p.name}</h4></a>
        <p class="body-muted" style="font-size:0.88rem; margin-bottom:10px;">${p.brandFit}</p>
        <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
          <div style="display:flex; align-items:center; border:1px solid var(--border);">
            <button class="btn-sm" style="background:transparent;border:none;color:var(--text);width:34px;" data-action="dec" data-id="${p.id}">−</button>
            <span style="padding:0 12px; font-family:var(--font-display);">${line.qty}</span>
            <button class="btn-sm" style="background:transparent;border:none;color:var(--text);width:34px;" data-action="inc" data-id="${p.id}">+</button>
          </div>
          <span class="price" style="font-size:1.1rem;">${formatZAR(line.lineTotal)}</span>
          <button data-action="remove" data-id="${p.id}" style="background:none;border:none;color:var(--text-muted);font-size:0.85rem;text-decoration:underline;">Remove</button>
        </div>
      </div>
    </div>`;
  }

  function renderCartPage() {
    const lines = getCartLines();
    const itemsEl = document.getElementById("cartItems");

    if (!lines.length) {
      itemsEl.innerHTML = `<div class="empty-state">
        <h3>Your cart is empty</h3>
        <p>Browse our mags and tyres to find the right fit for your car.</p>
        <a class="btn btn-primary" href="mags.html">Shop Mags</a>
      </div>`;
      document.getElementById("cartSummary").style.display = "none";
    } else {
      itemsEl.innerHTML = lines.map(cartLineHTML).join("");
      document.getElementById("cartSummary").style.display = "block";
      itemsEl.querySelectorAll("[data-action]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          const line = lines.find((l) => l.product.id === id);
          if (btn.dataset.action === "inc") setQty(id, line.qty + 1);
          if (btn.dataset.action === "dec") setQty(id, line.qty - 1);
          if (btn.dataset.action === "remove") removeFromCart(id);
          renderCartPage();
        });
      });
    }

    const subtotal = getCartSubtotal();
    document.getElementById("sumSubtotal").textContent = formatZAR(subtotal);
    document.getElementById("sumTotal").textContent = formatZAR(subtotal);
  }

  document.addEventListener("DOMContentLoaded", renderCartPage);
</script>
</body>
</html>
