<script>
  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name);
  }

  function renderProductPage() {
    const id = getParam("id");
    const product = getProductById(id);
    const root = document.getElementById("productRoot");

    if (!product) {
      root.innerHTML = `<div class="empty-state">
        <h3>Product not found</h3>
        <p>This item may have sold or moved. Browse the current range instead.</p>
        <a class="btn btn-outline" href="mags.html">View Mags</a>
      </div>`;
      return;
    }

    document.getElementById("pageTitle").textContent = `${product.name} | RIM STUDIO Sandton`;
    document.getElementById("pageDesc").setAttribute("content", product.description);
    document.getElementById("crumbCategory").textContent = product.category === "tyres" ? "Tyres" : "Mags";
    document.getElementById("crumbCategory").href = product.category === "tyres" ? "tyres.html" : "mags.html";
    document.getElementById("crumbName").textContent = product.name;
    document.body.dataset.page = product.category === "tyres" ? "tyres" : "mags";

    const specs = [
      ["Size", product.size],
      ["Bolt Pattern", product.boltPattern],
      ["Quantity", product.quantity],
      ["Finish", product.finish],
      ["Vehicle Fit", product.brandFit],
    ].filter(([, v]) => v);

    root.innerHTML = `
      <div class="two-col" style="align-items:flex-start;">
        <div class="product-media" style="border:1px solid var(--border); aspect-ratio:4/3;">
          ${product.tag ? `<span class="badge">${product.tag}</span>` : ""}
          ${productImageMarkup(product)}
        </div>
        <div>
          <span class="section-label">${product.category === "tyres" ? "Tyres" : "Mags"}</span>
          <h1 class="h2" style="margin:14px 0 10px;">${product.name}</h1>
          <p class="body-muted" style="margin-bottom:20px;">${product.brandFit}</p>

          <div class="price-row" style="margin-bottom:24px;">
            <span class="price" style="font-size:2rem;">${formatZAR(product.price)}</span>
            ${product.wasPrice ? `<span class="price-was">${formatZAR(product.wasPrice)}</span>` : ""}
          </div>

          <p class="body-lg" style="margin-bottom:26px;">${product.description}</p>

          <table class="legal-table" style="margin-bottom:28px;">
            ${specs.map(([label, value]) => `<tr><th>${label}</th><td>${value}</td></tr>`).join("")}
          </table>

          <div style="display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:16px;">
            <label for="qty" style="color:var(--text-muted); font-size:0.9rem;">Qty</label>
            <input type="number" id="qty" min="1" value="1" style="width:80px; background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:11px; text-align:center;" />
          </div>

          <div style="display:flex; gap:14px; flex-wrap:wrap;">
            <button class="btn btn-primary" id="addBtn">Add to Cart</button>
            <a href="${waLink('Hi RIM STUDIO, I am interested in the ' + product.name + '.')}" target="_blank" rel="noopener" class="btn btn-whatsapp">Ask on WhatsApp</a>
          </div>
        </div>
      </div>
    `;

    document.getElementById("addBtn").addEventListener("click", () => {
      const qty = Math.max(1, parseInt(document.getElementById("qty").value, 10) || 1);
      addToCart(product.id, qty);
      const btn = document.getElementById("addBtn");
      btn.textContent = "Added to Cart ✓";
      setTimeout(() => (btn.textContent = "Add to Cart"), 1600);
    });

    const schema = {
      "@context": "https://schema.org",
      "@type": "Product",
      name: product.name,
      description: product.description,
      brand: { "@type": "Brand", name: "RIM STUDIO" },
      offers: {
        "@type": "Offer",
        priceCurrency: "ZAR",
        price: product.price,
        availability: "https://schema.org/InStock",
        url: `https://rimstudio.co.za/product.html?id=${product.id}`,
      },
    };
    document.getElementById("productSchema").textContent = JSON.stringify(schema);

    const related = getProductsByCategory(product.category)
      .filter((p) => p.id !== product.id)
      .slice(0, 3);
    renderProductGrid("relatedGrid", related);
  }

  document.addEventListener("DOMContentLoaded", renderProductPage);
</script>
